name: Release

# Releases are produced from a developer machine via `scripts/release.ps1`,
# not from CI. The reason is documented in ROADMAP.md "CI narrowed to skip
# native module compile": getting `winax` to compile reliably on a
# GitHub-hosted Windows runner is a known rabbit hole that doesn't pay for
# itself until `winax` is replaced by the planned .NET sidecar.
#
# This workflow is kept as a workflow_dispatch-only stub so the release
# pipeline can be moved into CI cleanly once that replacement lands. It
# does not currently produce or upload anything; tag pushes do nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  noop:
    name: Release (CI placeholder)
    runs-on: ubuntu-latest
    steps:
      - name: Print release instructions
        run: |
          echo "Releases are built from a developer machine."
          echo "Run 'pwsh ./scripts/release.ps1' from a Windows checkout."
          echo "See docs/distribution.md for the full procedure."
