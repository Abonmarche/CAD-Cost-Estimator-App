appId: com.abonmarche.cost-estimator
productName: Cost Estimator
directories:
  output: dist
  buildResources: resources
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintrc.cjs,.eslintignore,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,package-lock.json,yarn.lock}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  - node_modules/winax/**
  # The Claude Agent SDK spawns the user's system `node` to run cli.js as a
  # subprocess. Plain Node has no asar reader, so cli.js + every module it
  # requires must sit on disk. Unpack the SDK and its peer/runtime deps.
  - node_modules/@anthropic-ai/**
  - node_modules/@modelcontextprotocol/**
  - node_modules/zod/**
win:
  target: nsis
  icon: resources/icon.ico
  executableName: cost-estimator
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-${version}-setup.${ext}'
  shortcutName: '${productName}'
  uninstallDisplayName: '${productName}'
  createDesktopShortcut: always
# Update feed. The installer + latest.yml + .blockmap are uploaded to this
# Azure Blob Storage container by the GitHub Actions release workflow. The
# installed app reads `latest.yml` from this URL on launch to check for
# updates. To switch storage accounts later, change this URL and re-tag a
# release. See docs/distribution.md for the full setup.
publish:
  provider: generic
  url: https://stcostestimatordist.blob.core.windows.net/cost-estimator/
  channel: latest
  useMultipleRangeRequest: true
